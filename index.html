```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Little Date ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #ff758c, #ff7eb3, #ffb6c1);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 92%;
            max-width: 520px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 10;
        }

        .heart {
            font-size: 70px;
            animation: heartbeat 1.2s infinite;
            margin-bottom: 15px;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        h1 {
            color: #ff3e6c;
            font-size: 30px;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #777;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 18px;
        }

        button {
            border: none;
            padding: 14px 30px;
            border-radius: 50px;
            font-size: 17px;
            cursor: pointer;
            transition: 0.3s;
        }

        .yes-btn {
            background: #ff3e6c;
            color: white;
            box-shadow: 0 8px 20px rgba(255, 62, 108, 0.35);
        }

        .yes-btn:hover {
            transform: scale(1.08);
            background: #ff174f;
        }

        .no-btn {
            background: #eeeeee;
            color: #555;
            cursor: default;
        }

        .hidden {
            display: none;
        }

        /* Calendar */

        .calendar-title {
            font-size: 27px;
            color: #ff3e6c;
            margin-bottom: 8px;
        }

        .calendar-subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 7px;
            margin-top: 15px;
        }

        .day-name {
            font-weight: bold;
            color: #ff3e6c;
            font-size: 13px;
        }

        .date {
            height: 42px;
            border: none;
            border-radius: 12px;
            background: #fff0f4;
            color: #444;
            padding: 0;
            font-size: 14px;
            cursor: pointer;
        }

        .date:hover {
            background: #ff3e6c;
            color: white;
            transform: scale(1.05);
        }

        .empty {
            background: transparent;
            cursor: default;
        }

        /* Final screen */

        .final-heart {
            font-size: 85px;
            animation: heartbeat 1s infinite;
        }

        .final-message {
            font-size: 32px;
            color: #ff3e6c;
            margin: 15px 0;
        }

        .selected-date {
            font-size: 19px;
            color: #555;
            margin-top: 15px;
        }

        .love-text {
            margin-top: 25px;
            color: #777;
            font-size: 17px;
            line-height: 1.6;
        }

        /* Floating hearts */

        .floating-heart {
            position: fixed;
            bottom: -30px;
            font-size: 25px;
            animation: floatUp 5s linear forwards;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 450px) {
            .container {
                padding: 30px 18px;
            }

            h1 {
                font-size: 25px;
            }

            .heart {
                font-size: 60px;
            }

            .date {
                height: 38px;
                font-size: 13px;
            }

            .final-message {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- PAGE 1 -->
        <div id="questionPage">

            <div class="heart">❤️</div>

            <h1>Will you go on a date with me?</h1>

            <p class="subtitle">
                I have a very important question for you... 🥺
            </p>

            <div class="buttons">
                <button class="yes-btn" onclick="showCalendar()">
                    YES ❤️
                </button>

                <button class="no-btn">
                    NO 😌
                </button>
            </div>

        </div>


        <!-- PAGE 2 -->
        <div id="calendarPage" class="hidden">

            <div class="heart">🥰</div>

            <h2 class="calendar-title">
                Yay! ❤️
            </h2>

            <p class="calendar-subtitle">
                Now choose our date 📅
            </p>

            <div class="calendar" id="calendar">

                <div class="day-name">Sun</div>
                <div class="day-name">Mon</div>
                <div class="day-name">Tue</div>
                <div class="day-name">Wed</div>
                <div class="day-name">Thu</div>
                <div class="day-name">Fri</div>
                <div class="day-name">Sat</div>

            </div>

        </div>


        <!-- PAGE 3 -->
        <div id="finalPage" class="hidden">

            <div class="final-heart">
                ❤️
            </div>

            <h2 class="final-message">
                Thank you for loving me!
            </h2>

            <p class="selected-date" id="selectedDate"></p>

            <p class="love-text">
                I can't wait to spend that beautiful day with you. 🥹❤️
                <br><br>
                It's a date! 🌹✨
            </p>

        </div>

    </div>


    <script>

        // Show calendar
        function showCalendar() {

            document.getElementById("questionPage").classList.add("hidden");

            document.getElementById("calendarPage").classList.remove("hidden");

            createCalendar();

            createHearts();
        }


        // Create current month's calendar
        function createCalendar() {

            const calendar = document.getElementById("calendar");

            // Keep day names
            const dayNames = calendar.innerHTML;

            calendar.innerHTML = dayNames;

            const today = new Date();

            const year = today.getFullYear();

            const month = today.getMonth();

            const firstDay = new Date(year, month, 1).getDay();

            const daysInMonth = new Date(year, month + 1, 0).getDate();


            // Empty spaces before first day
            for (let i = 0; i < firstDay; i++) {

                const empty = document.createElement("div");

                empty.classList.add("date", "empty");

                calendar.appendChild(empty);
            }


            // Dates
            for (let day = 1; day <= daysInMonth; day++) {

                const dateButton = document.createElement("button");

                dateButton.classList.add("date");

                dateButton.innerText = day;

                dateButton.onclick = function () {

                    selectDate(year, month, day);

                };

                calendar.appendChild(dateButton);
            }
        }


        // Date selection
        function selectDate(year, month, day) {

            const date = new Date(year, month, day);

            const options = {
                weekday: "long",
                year: "numeric",
                month: "long",
                day: "numeric"
            };

            const formattedDate = date.toLocaleDateString(
                "en-US",
                options
            );


            document.getElementById("calendarPage")
                .classList.add("hidden");

            document.getElementById("finalPage")
                .classList.remove("hidden");


            document.getElementById("selectedDate").innerHTML =
                "Our date is set for <strong>" +
                formattedDate +
                "</strong> 🥰";


            createHearts();

            createHearts();

            createHearts();
        }


        // Floating hearts
        function createHearts() {

            for (let i = 0; i < 15; i++) {

                setTimeout(() => {

                    const heart = document.createElement("div");

                    heart.classList.add("floating-heart");

                    heart.innerHTML =
                        ["❤️", "💗", "💕", "💖", "💘"][
                            Math.floor(Math.random() * 5)
                        ];

                    heart.style.left =
                        Math.random() * 100 + "vw";

                    heart.style.animationDuration =
                        (3 + Math.random() * 3) + "s";

                    document.body.appendChild(heart);


                    setTimeout(() => {

                        heart.remove();

                    }, 6000);

                }, i * 150);
            }
        }

    </script>

</body>
</html>
